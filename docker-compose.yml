services:
  frontend:
    build:
      context: ./frontend
    container_name: media-sequencer-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: media-sequencer-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: media_sequencer
      DB_USER: postgres
      DB_PASSWORD: postgres
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    container_name: media-sequencer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: media_sequencer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: